    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Para Gisell 💗</title>
        <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
        <style>
            :root {
                --hot-pink: #ff007f;
                --soft-pink: #ffb6c1;
                --deep-red: #d00000;
                --bg-love: #fff0f5;
            }
            body { 
                margin: 0; display: flex; justify-content: center; align-items: center; 
                min-height: 100vh; background: var(--bg-love); 
                font-family: 'MedievalSharp', cursive; overflow: hidden;
                background-image: radial-gradient(circle, #ffe4e1 0%, #ffc0cb 100%);
            }
            
            /* Caja de regalo - Estilo Rosa y Rojo */
            .gift {
                width: 120px; height: 120px; background: var(--hot-pink); position: relative;
                cursor: pointer; animation: bounce 2s infinite; border-radius: 10px;
                border: 3px solid white;
                box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3);
            }
            .gift::before { content: ''; position: absolute; width: 25px; height: 100%; background: var(--deep-red); left: 47.5px; }
            .gift::after { content: ''; position: absolute; height: 25px; width: 100%; background: var(--deep-red); top: 47.5px; }

            @keyframes bounce { 0%, 100% {transform: translateY(0) rotate(0deg);} 50% {transform: translateY(-30px) rotate(-5deg);} }
            
            /* Carta Profesional - Estilo Rosado */
            .card { 
                display: none; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
                padding: 50px; border-radius: 20px; text-align: center; color: #333;
                border: 4px double var(--hot-pink); box-shadow: 0 0 40px var(--soft-pink);
                max-width: 500px; animation: fadeIn 1.2s ease-out;
            }
            @keyframes fadeIn { from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);} }
            
            h1 { 
                font-family: 'UnifrakturMaguntia', serif; 
                color: var(--deep-red); font-size: 4em; margin: 0; 
                text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            }
            p.mensaje-dinamico {
                font-size: 1.5em; min-height: 60px; margin-top: 20px; color: var(--hot-pink);
                font-weight: bold;
            }
            
            button { 
                background: linear-gradient(45deg, var(--hot-pink), var(--deep-red)); 
                color: white; border: none; padding: 12px 25px; 
                border-radius: 30px; cursor: pointer; margin-top: 20px; 
                font-family: 'MedievalSharp', cursive; font-size: 1.1em;
                transition: all 0.3s; box-shadow: 0 4px 15px rgba(208, 0, 0, 0.3);
            }
            button:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--hot-pink); }
            
            .heart { position: absolute; color: var(--deep-red); animation: float 4s linear infinite; pointer-events: none; }
            @keyframes float { to {transform: translateY(-110vh) rotate(360deg); opacity: 0;} }
        </style>
    </head>
    <body>
        <div id="gift" class="gift" onclick="openGift()"></div>
        
        <div id="mainCard" class="card">
            <h1>De: Danny</h1>
            <p style="font-size: 1.8em; color: var(--hot-pink);">Para: Mi Flaca 💗</p>
            <p class="mensaje-dinamico" id="textChange">¡Has abierto mi corazón! 💗</p>
            <button onclick="cambiarMensaje()">✨ Presiona aquí ✨</button>
        </div>

        <script>
            const frases = [
                "Eres el sueño del que nunca quiero despertar.",
                "Cada latido de mi corazón lleva grabado tu nombre.",
                "Tú eres mi lugar favorito en el mundo entero.",
                "Eres la casualidad más bonita que me ha pasado.",
                "Amarte es el viaje más dulce de mi vida.",
                "Gisell, eres mi presente y mi futuro."
            ];

            function openGift() {
                document.getElementById('gift').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
                setInterval(crearCorazon, 300);
            }

            function cambiarMensaje() {
                const textElem = document.getElementById('textChange');
                const randomFrase = frases[Math.floor(Math.random() * frases.length)];
                textElem.style.opacity = 0;
                setTimeout(() => {
                    textElem.innerHTML = randomFrase;
                    textElem.style.opacity = 1;
                    textElem.style.transition = "opacity 0.5s";
                }, 300);
                crearCorazonLluvia();
            }

            function crearCorazon() {
                const h = document.createElement('div');
                h.innerHTML = '💗'; h.className = 'heart';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.top = '100vh'; h.style.fontSize = Math.random() * 20 + 15 + 'px';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }

            function crearCorazonLluvia() {
                for(let i=0; i<15; i++) setTimeout(crearCorazon, i*100);
            }
        </script>
    </body>
    </html>
